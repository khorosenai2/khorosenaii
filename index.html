<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --overlay-color: rgba(0,0,0,0.55);
    --accent: #c8a97e;
    --card-bg: rgba(12,12,14,0.72);
    --card-border: rgba(255,255,255,0.08);
    --text-primary: #f0ece4;
    --text-secondary: #9a9490;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    background-color: #0c0c0e;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    image-rendering: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  body::before {
    content:'';
    position:fixed;
    inset:0;
    background: var(--overlay-color);
    z-index:0;
  }

  .card {
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    background: var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:2.5rem 2rem;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    animation: fadeUp 0.55s ease both;
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(22px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .avatar-wrap { display:flex; justify-content:center; margin-bottom:1.25rem; }

  .avatar {
    width:88px; height:88px;
    border-radius:50%;
    border:2px solid var(--accent);
    background:#1a1a1e;
    display:flex; align-items:center; justify-content:center;
    font-family:'DM Serif Display',serif;
    font-size:2rem; color:var(--accent);
    overflow:hidden;
  }

  .avatar img { width:100%; height:100%; object-fit:cover; }

  .name {
    font-family:'DM Serif Display',serif;
    font-size:1.75rem;
    color:var(--text-primary);
    text-align:center;
    line-height:1.2;
    margin-bottom:0.35rem;
  }

  .badge {
    display:block; text-align:center;
    font-size:0.72rem; font-weight:500;
    letter-spacing:0.14em; text-transform:uppercase;
    color:var(--accent); margin-bottom:1.5rem;
  }

  .sep { width:40px; height:1px; background:var(--card-border); margin:0 auto 1.5rem; }

  .bio {
    font-size:0.9rem; font-weight:300; line-height:1.75;
    color:var(--text-secondary); text-align:center; margin-bottom:2rem;
  }

  .links { display:flex; flex-direction:column; gap:0.65rem; margin-bottom:1.75rem; }

  .link-item {
    display:flex; align-items:center; gap:0.75rem;
    padding:0.7rem 1rem;
    border-radius:8px;
    border:1px solid var(--card-border);
    background:rgba(255,255,255,0.03);
    text-decoration:none; color:var(--text-primary);
    font-size:0.875rem; font-weight:400;
    transition:border-color 0.2s,background 0.2s;
  }

  .link-item:hover { border-color:var(--accent); background:rgba(200,169,126,0.07); }

  .link-icon { width:18px; height:18px; flex-shrink:0; opacity:0.7; }

  .link-label { flex:1; }
  .link-sub { font-size:0.72rem; color:var(--text-secondary); }

  .link-arrow { opacity:0.25; flex-shrink:0; }


  .music-bar {
    display:flex; align-items:center; gap:0.75rem;
    padding:0.65rem 1rem;
    border-radius:8px;
    border:1px solid var(--card-border);
    background:rgba(255,255,255,0.03);
  }

  .music-btn {
    background:none; border:none; cursor:pointer; padding:0;
    color:var(--text-primary);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:color 0.2s;
  }
  .music-btn:hover { color:var(--accent); }

  .music-info { flex:1; overflow:hidden; }
  .music-title { font-size:0.8rem; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .music-artist { font-size:0.7rem; color:var(--text-secondary); }

  .music-progress { width:100%; height:2px; background:rgba(255,255,255,0.1); border-radius:2px; margin-top:6px; overflow:hidden; }
  .music-fill { height:100%; background:var(--accent); border-radius:2px; width:0%; transition:width 1s linear; }

  .music-live {
    width:6px; height:6px; border-radius:50%;
    background:var(--accent); flex-shrink:0;
    animation:pulse 1.4s ease infinite;
    display:none;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:0.3; transform:scale(0.6); }
  }

  .footer {
    text-align:center; margin-top:1.75rem;
    font-size:0.7rem; color:rgba(154,148,144,0.4); letter-spacing:0.06em;
  }

  #loader {
    position:fixed; inset:0; background:#0c0c0e;
    display:flex; align-items:center; justify-content:center;
    z-index:100; transition:opacity 0.4s;
  }
  .spinner {
    width:28px; height:28px; border:2px solid rgba(255,255,255,0.1);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>

<div class="card" id="card" style="display:none">

  <div class="avatar-wrap">
    <div class="avatar" id="avatarEl"></div>
  </div>

  <h1 class="name" id="userName"></h1>
  <span class="badge" id="userBadge"></span>
  <div class="sep"></div>
  <p class="bio" id="userBio"></p>

  <div class="links" id="linksList"></div>

  <div class="music-bar">
    <button class="music-btn" id="playBtn" onclick="toggleMusic()">
      <svg id="iconPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <div class="music-info">
      <div class="music-title" id="musicTitle"></div>
      <div class="music-artist" id="musicArtist"></div>
      <div class="music-progress"><div class="music-fill" id="musicFill"></div></div>
    </div>
    <div class="music-live" id="musicLive"></div>
  </div>

  <p class="footer" id="pageFooter"></p>
</div>

<audio id="bgAudio"></audio>

<script>
const ICONS = {

  github:    '<svg class="link-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>',
  twitch:    '<svg class="link-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>',
  youtube:   '<svg class="link-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>',
  twitter:   '<svg class="link-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
  instagram: '<svg class="link-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>',
  steam:     '<svg class="link-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.606 0 11.979 0z"/></svg>',
  web:       '<svg class="link-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>',
};

const ARROW = '<svg class="link-arrow" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>';

const audio   = document.getElementById('bgAudio');
const fill    = document.getElementById('musicFill');
const live    = document.getElementById('musicLive');
let playing   = false;

function setPlaying(state) {
  playing = state;
  document.getElementById('iconPlay').style.display  = state ? 'none' : '';
  document.getElementById('iconPause').style.display = state ? ''     : 'none';
  live.style.display = state ? 'block' : 'none';
}

function toggleMusic() {
  if (playing) {
    audio.pause();
    setPlaying(false);
  } else {
    audio.play().catch(() => {});
    setPlaying(true);
  }
}

audio.addEventListener('timeupdate', () => {
  if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
});

fetch('./config.json')
  .then(r => r.json())
  .then(cfg => {
    const r = document.documentElement.style;
    r.setProperty('--accent', cfg.background.accentColor);
    r.setProperty('--overlay-color', `rgba(0,0,0,${cfg.background.overlayOpacity})`);
    document.body.style.backgroundImage = `url('${cfg.background.imageUrl}')`;
    document.title = cfg.name;

    const av = document.getElementById('avatarEl');
    if (cfg.avatarUrl) {
      av.innerHTML = `<img src="${cfg.avatarUrl}" alt="avatar">`;
    } else {
      av.textContent = cfg.initials;
    }

    document.getElementById('userName').textContent    = cfg.name;
    document.getElementById('userBadge').textContent   = cfg.badge;
    document.getElementById('userBio').textContent     = cfg.bio;
    document.getElementById('musicTitle').textContent  = cfg.music.title;
    document.getElementById('musicArtist').textContent = cfg.music.artist;
    document.getElementById('pageFooter').textContent  = cfg.footer;

    const list = document.getElementById('linksList');
    cfg.links.forEach(l => {
      const a = document.createElement('a');
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'link-item';
      a.innerHTML = `${ICONS[l.type] || ICONS.web}
        <span class="link-label">
          <span style="display:block">${l.label}</span>
          <span class="link-sub">${l.sub}</span>
        </span>${ARROW}`;
      list.appendChild(a);
    });

    audio.loop = cfg.music.loop;
    audio.src  = cfg.music.src;

    document.getElementById('loader').style.opacity = '0';
    setTimeout(() => document.getElementById('loader').style.display = 'none', 400);
    document.getElementById('card').style.display = 'block';

 
    if (cfg.music.autoplay) {
      audio.play()
        .then(() => setPlaying(true))
        .catch(() => {
          const startOnClick = () => {
            audio.play().then(() => setPlaying(true)).catch(() => {});
            document.removeEventListener('click', startOnClick);
          };
          document.addEventListener('click', startOnClick);
        });
    }
  })
  .catch(err => {
    document.getElementById('loader').innerHTML =
      '<p style="color:#9a9490;font-family:sans-serif;font-size:.85rem">config.json introuvable.<br>Verifie que les deux fichiers sont dans le meme dossier.</p>';
    console.error(err);
  });
</script>
</body>
</html>
